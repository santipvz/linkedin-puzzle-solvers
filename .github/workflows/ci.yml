name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solver-and-extension-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Store complete environments, rather than reinstalling packages or
      # rebuilding their Docker layers for each source-only PR.
      - name: Restore CI environments
        id: environments
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/solver-ci-images.tar
          key: solver-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/local/Dockerfile', '.dockerignore', 'requirements.txt', 'requirements-dev.txt', 'services/solver_api/requirements.txt') }}

      - name: Load cached CI environments
        if: steps.environments.outputs.cache-hit == 'true'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/solver-ci-images.tar
        run: |
          docker load --input "$IMAGE_ARCHIVE"

      - name: Build CI environments on cache miss
        if: steps.environments.outputs.cache-hit != 'true'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/solver-ci-images.tar
        run: |
          docker build --target ci -f deploy/local/Dockerfile -t solver-ci-env .
          docker build --target dependencies -f deploy/local/Dockerfile -t solver-runtime-env .
          docker save --output "$IMAGE_ARCHIVE" solver-ci-env solver-runtime-env

      - name: Run all quality checks in the cached environment
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/app" \
            solver-ci-env

      # Reuse the saved production environment and only copy the current source.
      # This still validates the actual Dockerfile and .dockerignore on every PR.
      - name: Verify runtime image with cached dependencies
        run: |
          docker build --build-arg RUNTIME_BASE=solver-runtime-env -f deploy/local/Dockerfile -t solver-runtime-packaging .
          docker run --rm solver-runtime-packaging python -c "import cv2; from app.main import app; assert app.title"
