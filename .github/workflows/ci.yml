name: CI

on:
  push:
  pull_request:

jobs:
  solver-and-extension-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python modules
        run: |
          python -m ruff check .

      - name: Compile Python modules
        run: |
          python -m compileall -q core games services/solver_api/app scripts

      - name: Run Python test suite
        run: |
          python -m pytest --durations=10

      - name: Run solver smoke checks
        run: |
          python scripts/check_puzzle_registry_sync.py
          python scripts/smoke_check.py
          python scripts/api_endpoint_smoke.py

      - name: Build runtime image
        run: |
          docker build -f deploy/local/Dockerfile -t linkedin-puzzle-solvers-ci .
          docker run --rm linkedin-puzzle-solvers-ci python -c "import cv2; from app.main import app; assert app.title"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check extension JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/puzzle_registry.js
          node --check extension/wend_paths.js
          node --test extension/tests/*.test.js
