[project]
name = "linkedin-puzzle-solvers"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "opencv-python-headless==4.11.0.86",
  "numpy==1.26.4",
  "pillow==11.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = [
  "datasets",
  "deploy/local/.env",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E501",
  "E402",
]
