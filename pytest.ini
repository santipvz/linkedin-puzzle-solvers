[pytest]
minversion = 7.4
addopts =
    --import-mode=importlib
    --strict-config
    --strict-markers
    -ra
pythonpath = .
testpaths =
    tests
    games
    services/solver_api/tests
norecursedirs =
    .git
    .venv
    __pycache__
    assets
    datasets
    deploy
    examples
    templates
xfail_strict = true
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
